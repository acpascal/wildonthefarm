[build]
  command = "npm run build"
  publish = "dist"

# Redirect map: every URL that was ever live on the old Next.js site
# (v2, tag `v2-final`), across both domains it was deployed under and all
# 3 locales. Source of truth for old paths: `content/pages/**` frontmatter
# `slug:` fields on `origin/preview`, combined with that site's routing
# rules (Next.js i18n sub-path routing, unprefixed default locale;
# `getPageUrl()` in `src/utils/page-utils.js` prefixing blog posts with
# `/blog`). Goal: zero 404s for any URL that was ever live.
#
# Path-specific rules are listed before the domain catch-alls further
# below so they win first (Netlify matches top-to-bottom, first rule
# wins) — this keeps every redirect a single hop instead of chaining
# through the catch-all first. Every `to` here is an absolute
# https://wildonthefarm.com URL for the same reason: these rules must
# land on the new domain even when matched via a request to
# boquetecloudforestlodge.com, once that domain is eventually pointed
# at this site.

# --- EN: top-level pages (only ones whose slug actually changed —
# /stay/, /the-farm/, /kitchen/, and / carried over unchanged) ---
[[redirects]]
  from = "/bird-watching/"
  to = "https://wildonthefarm.com/birdwatching/"
  status = 301
  force = true

[[redirects]]
  from = "/detox-retreat/"
  to = "https://wildonthefarm.com/rates-retreats/"
  status = 301
  force = true

[[redirects]]
  from = "/experience/"
  to = "https://wildonthefarm.com/hiking/"
  status = 301
  force = true

[[redirects]]
  from = "/faq/"
  to = "https://wildonthefarm.com/faqs-contact/"
  status = 301
  force = true

