[build]
  command = "npm run build"
  publish = "dist"

# Redirect map: every URL that was ever live on the old Next.js site
# (v2, tag `v2-final`), across both domains it was deployed under and all
# 3 locales. Source of truth for old paths: `content/pages/**` frontmatter
# `slug:` fields on `origin/preview`, combined with that site's routing
# rules (Next.js i18n sub-path routing, unprefixed default locale;
# `getPageUrl()` in `src/utils/page-utils.js` prefixing blog posts with
# `/blog`). Goal: zero 404s for any URL that was ever live.
#
# Every `to` here is a host-relative path, not an absolute URL — Netlify
# matches these `from` paths against any hostname serving this site
# (wildonthefarm.com, wildonthefarm.netlify.app, deploy previews,
# `netlify dev` on localhost, and boquetecloudforestlodge.com, which is
# configured as a domain alias of this same site). Domain canonicalization
# for that alias is handled natively by Netlify's alias feature — these
# rules only need to fix the path, not force a domain, so they behave the
# same wherever they're evaluated instead of always jumping to production.
#
# Path-specific rules are listed before the more general ones (blog index
# before individual posts, etc.) so the most specific match wins first —
# every redirect here is a single hop, none of them chain through another
# rule in this file.

# --- EN: top-level pages (only / carried over unchanged — every other
# slug changed, confirmed against the real src/pages/*.astro files on
# main, not assumed) ---
[[redirects]]
  from = "/stay/"
  to = "/lodge/"
  status = 301
  force = true

[[redirects]]
  from = "/the-farm/"
  to = "/farm/"
  status = 301
  force = true

[[redirects]]
  from = "/kitchen/"
  to = "/food/"
  status = 301
  force = true

[[redirects]]
  from = "/bird-watching/"
  to = "/birdwatching/"
  status = 301
  force = true

[[redirects]]
  from = "/detox-retreat/"
  to = "/rates-retreats/"
  status = 301
  force = true

[[redirects]]
  from = "/experience/"
  to = "/hiking/"
  status = 301
  force = true

[[redirects]]
  from = "/faq/"
  to = "/faqs-contact/"
  status = 301
  force = true

