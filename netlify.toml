# --- Domain-level catch-alls. Inert until DNS for these domains is
# pointed at this Netlify site (deferred, out of scope for this plan) —
# safe to ship now as forward-looking config. Listed last so the
# path-specific rules above always win first and redirects stay a
# single hop. ---
[[redirects]]
  from = "https://www.wildonthefarm.com/*"
  to = "https://wildonthefarm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://boquetecloudforestlodge.com/*"
  to = "https://wildonthefarm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.boquetecloudforestlodge.com/*"
  to = "https://wildonthefarm.com/:splat"
  status = 301
  force = true
