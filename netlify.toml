[build]
  command = "npm run build"
  publish = "dist"

# Redirect map: every URL that was ever live on the old Next.js site
# (v2, tag `v2-final`), across both domains it was deployed under and all
# 3 locales. Source of truth for old paths: `content/pages/**` frontmatter
# `slug:` fields on `origin/preview`, combined with that site's routing
# rules (Next.js i18n sub-path routing, unprefixed default locale;
# `getPageUrl()` in `src/utils/page-utils.js` prefixing blog posts with
# `/blog`). Goal: zero 404s for any URL that was ever live.
#
# Every `to` here is a host-relative path, not an absolute URL — Netlify
# matches these `from` paths against any hostname serving this site
# (wildonthefarm.com, wildonthefarm.netlify.app, deploy previews, and
# `netlify dev` on localhost), so a bare path stays correct no matter
# which of those actually receives the request.
#
# boquetecloudforestlodge.com is added as a domain alias of this site, but
# a domain alias does NOT auto-redirect to the primary domain — confirmed
# by checking what adding one actually does: it just creates DNS records
# pointing that domain at this Netlify site, and the alias domain then
# serves the exact same content directly, with no canonicalization at
# all. (The www.wildonthefarm.com -> wildonthefarm.com redirect is a
# different, narrower feature — Netlify auto-manages the www/apex
# relationship for a site's own primary domain, not for unrelated
# secondary domains like this one.) So the two domain-scoped rules at the
# bottom of this file are the only thing that actually sends
# boquetecloudforestlodge.com traffic to wildonthefarm.com — they're load
# bearing, not redundant with anything Netlify does natively.
#
# These two are listed FIRST, before the path-specific rules, as a test:
# with them below the path rules, requests to boquetecloudforestlodge.com
# were observed serving content directly / 404ing instead of redirecting
# at all (verified with curl against a path with no matching rule and no
# real content — it 404'd instead of hitting this force=true catch-all).
# Netlify matches top to bottom, first match wins, so moving these first
# tests whether something below was shadowing them.
[[redirects]]
  from = "https://boquetecloudforestlodge.com/*"
  to = "https://wildonthefarm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.boquetecloudforestlodge.com/*"
  to = "https://wildonthefarm.com/:splat"
  status = 301
  force = true

